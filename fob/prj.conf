CONFIG_LOG=y
CONFIG_MAIN_STACK_SIZE=4096

# Bluetooth: connectable peripheral advertising with a rotating RPA (step 2)
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="PKE fob"
CONFIG_BT_MAX_CONN=1
CONFIG_BT_PRIVACY=y
# Short rotation period to exercise RPA resolution during testing; the default is 900 s.
CONFIG_BT_RPA_TIMEOUT=60

# LE Secure Connections Just Works, no bonding: encryption only, the app does the auth (step 3)
CONFIG_BT_SMP=y
CONFIG_BT_BONDABLE=n

# Room for the 49-byte FOB_PROOF notification
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251

# PSA crypto on CryptoCell-310
CONFIG_PSA_CRYPTO=y
CONFIG_PSA_WANT_GENERATE_RANDOM=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_ALG_HMAC=y
CONFIG_PSA_WANT_KEY_TYPE_HMAC=y
CONFIG_PSA_WANT_ALG_HKDF=y
