CONFIG_LOG=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_EVENTS=y

# Onboard RGB LED boot animation (common/boot_led.c)
CONFIG_GPIO=y

# System OFF after 4 days without a fob session (power.c)
CONFIG_POWEROFF=y

# Bluetooth: central that scans for the fob and keeps one link (steps 2 and 6)
CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_DEVICE_NAME="PKE car"
CONFIG_BT_MAX_CONN=1
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_GATT_AUTO_DISCOVER_CCC=y
# Lets the controller answer HCI Read RSSI on the live link (step 6)
CONFIG_BT_CTLR_CONN_RSSI=y

# LE Secure Connections Just Works, no bonding: encryption only, the app does the auth (step 3)
CONFIG_BT_SMP=y
CONFIG_BT_BONDABLE=n

# Room for the 49-byte FOB_PROOF notification
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251

# PSA crypto on CryptoCell-310
CONFIG_PSA_CRYPTO=y
CONFIG_PSA_WANT_GENERATE_RANDOM=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_ALG_HMAC=y
CONFIG_PSA_WANT_KEY_TYPE_HMAC=y
CONFIG_PSA_WANT_ALG_HKDF=y
# AES-ECB for resolving the fob's RPA
CONFIG_PSA_WANT_KEY_TYPE_AES=y
CONFIG_PSA_WANT_ALG_ECB_NO_PADDING=y

# Door frames over CAN through the MCP2515 on SPI (door.c)
CONFIG_SPI=y
CONFIG_CAN=y

# INMP441 microphone, clocked only while a fob is authenticated (tap_listener.cpp)
CONFIG_I2S=y

# The tap detector sources are C++ with float math
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_FPU=y
# Floats in the EVT log lines
CONFIG_CBPRINTF_FP_SUPPORT=y
