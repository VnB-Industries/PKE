; PKE car unit on an ESP32 DevKit (ESP32-WROOM). Build and flash from PKE/:
;   pio run -d car -t upload -t monitor
; or scripts/flash.sh.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
  -I../common
  -Isrc/tap
lib_deps =
  h2zero/NimBLE-Arduino@^2.5.1
  coryjfowler/mcp_can@^1.5.1
